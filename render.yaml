# Render blueprint: one web service, built from the Dockerfile at the repository root.
#
# Deploy from the "Deploy to Render" button in the README, or in the Render dashboard with
# New > Blueprint and this repository. Nothing needs filling in: the admin username is `admin`
# and Render generates a long random password for it. Read the password afterwards in the
# service's Environment tab (AETOS_ADMIN_PASSWORD) and sign in with it.
#
# Neither value is a default credential: the password is generated per deployment and is
# visible only to whoever controls the Render account. Typed values were the most common way
# for a deploy to fail, because a blank or short password refuses the start on purpose
# (backend/auth/bootstrap.py) and Render shows that as a deploy that keeps failing.
#
# To add a read-only account to share, set AETOS_VIEWER_USERNAME and AETOS_VIEWER_PASSWORD
# (12+ characters) in the Environment tab; both or neither.
#
# Render terminates TLS in front of the container and the service is reachable only through it,
# which is what makes the image's `--behind-proxy` true (docs/deployment.md).
#
# The free plan sleeps after 15 minutes without traffic and takes about a minute to wake, and
# its disk is wiped on every restart: each wake starts a fresh event log, and the accounts are
# recreated from these variables. Move to a paid plan and add a disk on /app/data to keep
# history across restarts.
services:
  - type: web
    name: aetos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Readable without a session, and liveness only until authenticated.
    healthCheckPath: /api/v1/system/health
    autoDeploy: true
    envVars:
      - key: AETOS_ADMIN_USERNAME
        value: admin
      - key: AETOS_ADMIN_PASSWORD
        generateValue: true
