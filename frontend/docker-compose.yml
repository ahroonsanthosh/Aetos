# Aetos, in one command:
#
#   docker compose up
#
# Then open http://localhost:8000. Nothing beyond Docker is needed — no Python, no Node.
#
# To run a different scenario:
#   docker compose run --rm --service-ports aetos --scenario h_track_crossing

services:
  aetos:
    build: .
    ports:
      # Bound to localhost deliberately. Aetos has no authentication of any kind
      # (docs/failure_modes.md FM-001), so anyone who can reach this port has the full
      # operator interface and the complete event log. Publishing it on 0.0.0.0 would expose
      # that to the whole network.
      - "127.0.0.1:8000:8000"
    volumes:
      # The event log is the source of truth and survives the container.
      # Holds both levels of the data layout: data/identity.db (accounts, installation-wide)
      # and data/<site>/<mode>/ (one deployment's event log and projection). One volume keeps
      # accounts and history together across container restarts — losing it loses both.
      - aetos-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/mode')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  aetos-data:
