[project]
name = "aetos"
version = "0.1.0"
description = "Aetos — modular Counter-UAS command-and-control platform (software only; recommendation, never execution)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Only needed to talk to physical sensor hardware. Deliberately optional: the whole test suite
# runs without it, because every adapter is written against a byte-pipe interface rather than
# against a serial port (ADR 0017).
hardware = [
    "pyserial>=3.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Every top-level package the application imports must be listed here.
#
# `scenarios` was missing, and `backend.main` imports it at module level — so the process
# started only when the working directory happened to be the repository root, and failed
# anywhere else with a bare ModuleNotFoundError before argparse or any message of ours ran.
# `tests/unit/test_packaging.py` now derives this list from the imports themselves.
include = ["backend*", "sensors*", "scenarios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
