[project]
name = "aetos"
version = "0.1.0"
description = "Aetos — modular Counter-UAS command-and-control platform (software only; recommendation, never execution)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The physical camera path. Optional because it is heavy, is not needed to run the simulator,
# the radar path or the test suite, and must not be a prerequisite for building the system on
# a machine that has no camera attached to it.
camera = [
    "opencv-python>=4.9",
    "ultralytics>=8.2",
]
dev = [
    "pytest>=8.0",
    "opencv-python-headless>=4.9",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "sensors*"]

[tool.pytest.ini_options]
testpaths = ["tests", "sensors/tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
