[project]
name = "aetos"
version = "0.1.0"
description = "Aetos — modular Counter-UAS command-and-control platform (software only; recommendation, never execution)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
serial = [
    # Only needed to talk to a serial sensor. Kept out of the core install so that the wire
    # codec, which needs nothing, imports on a machine that will never see hardware — and so
    # that `pip install -e .` stays the same for everyone else. The transport imports it
    # lazily and the error names this extra.
    "pyserial>=3.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "pyserial>=3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "sensors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
